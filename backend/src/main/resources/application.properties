# ===============================================================
# 1. DATABASE CONNECTION (PostgreSQL + Docker)
# ===============================================================
# If running in Docker, 'localhost' should be the service name (e.g., 'db')
spring.datasource.url=jdbc:postgresql://localhost:5432/tripify_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================================
# 2. JPA / HIBERNATE (Integrity & Schema Management)
# ===============================================================
# TEXTBOOK vs REAL WORLD:
# In dev, we use 'update'. In production, we use 'none' or 'validate'
# to ensure code doesn't accidentally destroy production data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DIALECT: Tells Hibernate exactly how to write SQL for Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CONCURRENCY (Optimistic Locking):
# This ensures that @Version columns are handled correctly
spring.jpa.properties.hibernate.locking.optimistic_lock_timeout=5000

# ===============================================================
# 3. TRANSACTION MANAGEMENT & INTEGRITY
# ===============================================================
# Ensure that if a @Transactional method fails, everything rolls back
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ===============================================================
# 4. EXTERNAL INTEGRATIONS (e.g., STRIPE)
# ===============================================================
# Never hardcode these keys! Use Environment Variables ${VAR_NAME}
# This prevents your secret keys from being leaked to GitHub.
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ===============================================================
# 5. LOGGING & DEBUGGING
# ===============================================================
# TRACE/DEBUG for dev, WARN/ERROR for production
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG

jwt.secret=${JWT_SECRET_KEY}

# Expiration set to 24 hours (86400000 ms)
jwt.expiration-ms=86400000
gemini.api.key=${GEMINI_API_KEY}

app.frontend.url=http://localhost:5173
